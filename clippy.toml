allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
# One way to do each job: the listed call lives in one wrapper (allowed there), the rest of the
# crate calls the wrapper.
disallowed-methods = [
  { path = "humantime::parse_duration", reason = "call schema_emit_runtime's decode, which holds the one parse" },
]
